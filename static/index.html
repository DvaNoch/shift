<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник смен</title>
<style>
  /* Layout: закреплённый переключатель дня, под ним сводка 2×2 с разбивкой оплаты и лента поездок */
  :root {
    --ground: #eef1f4;
    --surface: #ffffff;
    --ink: #17212b;
    --muted: #5b6876;
    --line: #d8dee5;
    --accent: #0b7a57;
    --accent-soft: #dcefe7;
    --cash: #b7791f;
    --card: #3563c9;
    --danger: #b3261e;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0e1419;
      --surface: #171f27;
      --ink: #e5ebf0;
      --muted: #94a1ae;
      --line: #2a3540;
      --accent: #3fc493;
      --accent-soft: #163a2e;
      --cash: #e0a64a;
      --card: #7aa0f2;
      --danger: #f2877f;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.45 var(--font);
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Переключатель дня */
  .bar {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--ground);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .bar .wrap { display: flex; flex-direction: column; gap: 8px; padding-block: 12px; }
  .bar-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .today-btn {
    border: 0; background: none; padding: 4px 0;
    color: var(--accent); font-weight: 600; font-size: 0.9375rem; cursor: pointer;
  }
  .day-nav { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; align-items: stretch; }
  .step {
    min-height: 52px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); font-size: 1.5rem; line-height: 1; cursor: pointer;
  }
  .step:active { background: var(--accent-soft); }
  .day-pick {
    position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center;
    min-height: 52px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    padding-inline: 8px; cursor: pointer; text-align: center;
  }
  .day-pick:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  #day-label { font-size: 1.125rem; font-weight: 650; }
  #day-sub { font-size: 0.8125rem; color: var(--muted); }
  #day-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; }

  main .wrap { display: flex; flex-direction: column; gap: 24px; padding-block: 16px 40px; }
  main[aria-busy="true"] .summary, main[aria-busy="true"] .trips { opacity: 0.55; transition: opacity 0.15s; }

  /* Сводка */
  .summary { display: flex; flex-direction: column; gap: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .tile dt { font-size: 0.8125rem; color: var(--muted); }
  .tile dd { margin: 0; font-size: 1.375rem; font-weight: 650; overflow-wrap: anywhere; }
  .tile.net { background: var(--accent-soft); border-color: transparent; }
  .tile.net dt { color: var(--ink); font-weight: 600; }
  .tile.net dd { color: var(--accent); }
  .tile .hint { font-size: 0.75rem; color: var(--muted); }

  .split { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .split-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
  .split-bar span { display: block; height: 100%; transition: width 0.25s; }
  #bar-cash { background: var(--cash); }
  #bar-card { background: var(--card); }
  .split-legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .legend { display: flex; flex-direction: column; gap: 0; }
  .legend-name { display: flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--muted); }
  .legend b { font-size: 1.0625rem; font-weight: 650; }
  .legend small { font-size: 0.8125rem; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.cash { background: var(--cash); }
  .dot.card { background: var(--card); }

  /* Поездки */
  .trips { display: flex; flex-direction: column; gap: 8px; }
  h2 { margin: 0; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .trip-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .trip {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    display: grid; grid-template-columns: 1fr auto; grid-template-areas: "time amount" "meta fee"; gap: 2px 12px;
  }
  .t-time { grid-area: time; font-weight: 650; }
  .t-time sup { font-size: 0.6875rem; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .t-meta { grid-area: meta; font-size: 0.875rem; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .t-amount { grid-area: amount; font-weight: 650; text-align: right; }
  .t-fee { grid-area: fee; font-size: 0.875rem; color: var(--muted); text-align: right; }
  .t-net, .t-head { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.8125rem; color: var(--ink); }

  .note { margin: 0; padding: 20px 14px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
  .note.error { color: var(--danger); border-style: solid; }

  @media (min-width: 640px) {
    .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .trip-list { gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .trip, .t-head {
      display: grid; border: 0; border-radius: 0;
      grid-template-columns: 1.4fr 0.8fr 1fr 1fr 1fr 1fr; grid-template-areas: none; gap: 12px;
      padding: 10px 14px; align-items: center;
    }
    .trip + .trip { border-top: 1px solid var(--line); }
    .t-head { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-block: 0; background: none; }
    .t-head span:nth-child(n+4) { text-align: right; }
    .t-time, .t-meta, .t-amount, .t-fee, .t-net { grid-area: auto; }
    .t-meta { display: contents; }
    .t-dur { color: var(--muted); }
    .t-fee { font-size: inherit; }
    .t-net { display: block; text-align: right; color: var(--accent); font-weight: 600; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="bar-top">
      <h1>Дневник смен</h1>
      <button type="button" class="today-btn" id="today-btn">К сегодняшнему дню</button>
    </div>
    <nav class="day-nav" aria-label="Выбор дня">
      <button type="button" class="step" id="prev-btn" aria-label="Предыдущий день">‹</button>
      <label class="day-pick" for="day-input">
        <span id="day-label">—</span>
        <span id="day-sub"></span>
        <input type="date" id="day-input" aria-label="Выбрать дату">
      </label>
      <button type="button" class="step" id="next-btn" aria-label="Следующий день">›</button>
    </nav>
  </div>
</header>

<main id="main" aria-busy="false">
  <div class="wrap">
    <section class="summary" aria-label="Сводка за день" aria-live="polite">
      <dl class="tiles">
        <div class="tile net">
          <dt>На руки</dt>
          <dd id="s-net">—</dd>
          <span class="hint">выручка − комиссия</span>
        </div>
        <div class="tile"><dt>Выручка</dt><dd id="s-revenue">—</dd></div>
        <div class="tile"><dt>Комиссия</dt><dd id="s-commission">—</dd></div>
        <div class="tile"><dt>Поездок</dt><dd id="s-trips">—</dd></div>
      </dl>
      <div class="split" aria-label="Оплата">
        <div class="split-bar" aria-hidden="true"><span id="bar-cash" style="width:0"></span><span id="bar-card" style="width:0"></span></div>
        <div class="split-legend">
          <div class="legend">
            <span class="legend-name"><i class="dot cash"></i>Наличные</span>
            <b id="s-cash">—</b>
            <small id="s-cash-n"></small>
          </div>
          <div class="legend">
            <span class="legend-name"><i class="dot card"></i>Карта</span>
            <b id="s-card">—</b>
            <small id="s-card-n"></small>
          </div>
        </div>
      </div>
    </section>

    <section class="trips" aria-label="Поездки за день">
      <h2>Поездки</h2>
      <div class="t-head" aria-hidden="true">
        <span>Время</span><span>В пути</span><span>Оплата</span><span>Сумма</span><span>Комиссия</span><span>На руки</span>
      </div>
      <ol class="trip-list" id="trip-list"></ol>
      <p class="note" id="empty" hidden>За этот день поездок нет.</p>
      <p class="note error" id="error" role="alert" hidden></p>
    </section>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const wholeFmt = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
  const fracFmt = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // Неразрывный пробел перед ₸, чтобы знак не уезжал на следующую строку.
  const money = (value) => {
    const n = Number(value);
    return (Number.isInteger(n) ? wholeFmt : fracFmt).format(n) + ' ₸';
  };

  const plural = (n, one, few, many) => {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  };
  const tripsWord = (n) => `${n} ${plural(n, 'поездка', 'поездки', 'поездок')}`;

  // Даты дня — строки YYYY-MM-DD; арифметика в UTC, чтобы не мешал переход на летнее время.
  const pad = (n) => String(n).padStart(2, '0');
  const todayISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  const toUTCDate = (iso) => {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d));
  };
  const shiftDay = (iso, delta) => {
    const d = toUTCDate(iso);
    d.setUTCDate(d.getUTCDate() + delta);
    return d.toISOString().slice(0, 10);
  };
  const isValidDay = (iso) =>
    /^\d{4}-\d{2}-\d{2}$/.test(iso) && toUTCDate(iso).toISOString().slice(0, 10) === iso;

  const dayLabelFmt = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', timeZone: 'UTC' });
  const dayLabelYearFmt = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  const weekdayFmt = new Intl.DateTimeFormat('ru-RU', { weekday: 'long', timeZone: 'UTC' });

  // Время поездки показывается в её собственном поясе, как пришло с сервера.
  const clock = (isoWithOffset) => isoWithOffset.slice(11, 16);
  const minutesBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 60000);
  const duration = (min) => (min < 60 ? `${min} мин` : `${Math.floor(min / 60)} ч ${pad(min % 60)} мин`);

  const PAYMENT = { cash: 'Наличные', card: 'Карта' };

  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const wideScreen = matchMedia('(min-width: 640px)');
  let currentDay = null;
  let requestId = 0;
  let lastTrips = [];

  function renderHeader(day) {
    const today = todayISO();
    const date = toUTCDate(day);
    const sameYear = day.slice(0, 4) === today.slice(0, 4);
    $('day-label').textContent = (sameYear ? dayLabelFmt : dayLabelYearFmt).format(date);
    const relative = day === today ? 'сегодня' : day === shiftDay(today, -1) ? 'вчера' : '';
    const weekday = weekdayFmt.format(date);
    $('day-sub').textContent = relative ? `${relative}, ${weekday}` : weekday;
    $('day-input').value = day;
    $('today-btn').hidden = day === today;
    document.title = `${$('day-label').textContent} — Дневник смен`;
  }

  function renderSummary(s) {
    $('s-net').textContent = money(s.net);
    $('s-revenue').textContent = money(s.revenue);
    $('s-commission').textContent = money(s.commission);
    $('s-trips').textContent = String(s.trips);
    $('s-cash').textContent = money(s.cash.revenue);
    $('s-card').textContent = money(s.card.revenue);
    $('s-cash-n').textContent = tripsWord(s.cash.trips);
    $('s-card-n').textContent = tripsWord(s.card.trips);
    const total = Number(s.revenue);
    const cashShare = total > 0 ? (Number(s.cash.revenue) / total) * 100 : 0;
    $('bar-cash').style.width = `${cashShare}%`;
    $('bar-card').style.width = `${total > 0 ? 100 - cashShare : 0}%`;
  }

  function renderTrips(trips) {
    lastTrips = trips;
    const list = $('trip-list');
    // На широком экране колонка «Комиссия» подписана в шапке таблицы.
    const wide = wideScreen.matches;
    list.replaceChildren();
    for (const t of trips) {
      const row = el('li', 'trip');

      const time = el('span', 't-time', `${clock(t.start)}–${clock(t.end)}`);
      if (t.end.slice(0, 10) !== t.start.slice(0, 10)) {
        const next = el('sup', '', '+1 день');
        next.title = 'Поездка закончилась на следующий день';
        time.append(next);
      }

      const meta = el('span', 't-meta');
      meta.append(el('span', 't-dur', duration(minutesBetween(t.start, t.end))));
      const chip = el('span', 'chip');
      chip.append(el('i', `dot ${t.payment}`), PAYMENT[t.payment] ?? t.payment);
      meta.append(chip);

      const fee = el('span', 't-fee', wide ? money(t.commission) : `комиссия ${money(t.commission)}`);
      const net = el('span', 't-net', money(Number(t.amount) - Number(t.commission)));

      row.append(time, meta, el('span', 't-amount', money(t.amount)), fee, net);
      list.append(row);
    }
    list.hidden = trips.length === 0;
    document.querySelector('.t-head').hidden = trips.length === 0;
    $('empty').hidden = trips.length !== 0;
  }

  async function getJSON(url) {
    const res = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error(`сервер ответил ${res.status}`);
    return res.json();
  }

  async function load(day, { push = true } = {}) {
    currentDay = day;
    renderHeader(day);
    const url = new URL(location.href);
    url.searchParams.set('date', day);
    history[push ? 'pushState' : 'replaceState']({ day }, '', url);

    const id = ++requestId;
    $('main').setAttribute('aria-busy', 'true');
    $('error').hidden = true;
    try {
      const q = encodeURIComponent(day);
      const [summary, trips] = await Promise.all([getJSON(`/summary?date=${q}`), getJSON(`/trips?date=${q}`)]);
      if (id !== requestId) return; // пользователь уже переключил день
      renderSummary(summary);
      renderTrips(trips);
    } catch (err) {
      if (id !== requestId) return;
      $('error').textContent = `Не удалось загрузить данные за день (${err.message}). Проверьте, что сервер запущен, и обновите страницу.`;
      $('error').hidden = false;
    } finally {
      if (id === requestId) $('main').setAttribute('aria-busy', 'false');
    }
  }

  wideScreen.addEventListener('change', () => renderTrips(lastTrips));

  $('prev-btn').addEventListener('click', () => load(shiftDay(currentDay, -1)));
  $('next-btn').addEventListener('click', () => load(shiftDay(currentDay, 1)));
  $('today-btn').addEventListener('click', () => load(todayISO()));
  $('day-input').addEventListener('change', (e) => {
    if (isValidDay(e.target.value)) load(e.target.value);
  });
  $('day-input').addEventListener('click', (e) => {
    try { e.target.showPicker?.(); } catch { /* браузер сам откроет выбор даты */ }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowLeft') load(shiftDay(currentDay, -1));
    if (e.key === 'ArrowRight') load(shiftDay(currentDay, 1));
  });
  window.addEventListener('popstate', (e) => {
    const day = e.state?.day ?? new URL(location.href).searchParams.get('date');
    load(isValidDay(day ?? '') ? day : todayISO(), { push: false });
  });

  const initial = new URL(location.href).searchParams.get('date');
  load(isValidDay(initial ?? '') ? initial : todayISO(), { push: false });
})();
</script>
</body>
</html>
